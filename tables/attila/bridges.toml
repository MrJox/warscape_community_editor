# Attila: the kit bridges a procedural road's bridges are generated from (a road's road_bridge), in the order the editor lists them; a road
# asking for one this file does not have gets the first.
#
# This file comes with the editor (its tables folder) and an update replaces it: do not edit it. Put changes in a file beside it named
# bridges_<anything>.toml that starts with a mod_key: the start of a mod pack's name, the file then read only while such a pack is loaded
# in the editor (mod_key = "tdd_pack1_main_" for The Dawnless Days), or empty (mod_key = "") to read it always, for your own changes.
# The editor never writes those, and an update leaves them alone (but those it ships). They are read after this one, in their names'
# order; an entry in one replaces the one of the same key or name before it (whole), or is added after them. The editor reads them each
# time a tile is opened.
#   name    what a road's road_bridge says
#   label   its name in the editor's list
#   key     the bridge building: a deck along its x, bent along the road and widened to it (docs/plans/procedural_roads.md)
#   end     optional: its end piece, laid at each end of the deck (a ramp down from it)
#
# The wooden one alone for now: bridge_stone_1 is a humped bridge of its own, and cut into pieces it repeated its hump and its arch (its
# deck in steps); other bases wait for a standard shape a base is made to.

[[bases]]
name = "wood"
label = "Wood (bridge_wood_2)"
key = "bridge_wood_2"
end = "bridge_wood_2_end"
