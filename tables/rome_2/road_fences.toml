# Rome II: the fences of the generated dirt road types (roads_proc/dirt and roads_proc/dirt_track).
#
# This file comes with the editor (its tables folder) and an update replaces it: do not edit it. Put changes in a file beside it named
# road_fences_<anything>.toml that starts with a mod_key: the start of a mod pack's name, the file then read only while such a pack is loaded
# in the editor (mod_key = "tdd_pack1_main_" for The Dawnless Days), or empty (mod_key = "") to read it always, for your own changes.
# The editor never writes those, and an update leaves them alone (but those it ships). They are read after this one, in their names'
# order; an entry in one replaces the one of the same key or name before it (whole), or is added after them. The editor reads them each
# time a tile is opened.
#
# A fence piece is 5 m long: use a building about that long.
#   name     the piece's name (fence_<name>): lowercase letters, digits and _, not a number alone. [fence] has none.
#   key      the building (its key in battlefield_buildings).
#   along    "x": its model runs along its x from its pivot (the kit's lowfence_*); "z": along its z, about its pivot (the cultures' fences).
#   joiners  optional: buildings laid on the joints between two fences (one picked for each joint), as a building spline's joiners. They go
#            in the piece's joiner group (road_role="joiner"), at its back port. A road's road_fence_joiners can use others, or none.

[fence]
key = "lowfence_3"
along = "x"

[[named]]
name = "lowfence1"
key = "lowfence_1"
along = "x"

[[named]]
name = "lowfence2"
key = "lowfence_2"
along = "x"

[[named]]
name = "highfence"
key = "highfence_1"
along = "x"

[[named]]
name = "woven"
key = "barbarian_woven_fence_10m"
along = "x"

[[named]]
name = "roman"
key = "roman_lowfence"
along = "z"
joiners = ["roman_lowfence_pillar"]

[[named]]
name = "greek"
key = "greek_lowfence"
along = "z"
joiners = ["greek_lowfence_pillar"]

[[named]]
name = "egyptian"
key = "egyptian_lowfence"
along = "z"
joiners = ["egyptian_lowfence_pillar"]

[[named]]
name = "egyptian_high"
key = "egyptian_highfence"
along = "z"
joiners = ["egyptian_highfence_pillar"]

[[named]]
name = "persian"
key = "persian_lowfence"
along = "z"
joiners = ["persian_lowfence_pillar"]

[[named]]
name = "persian_high"
key = "persian_highfence"
along = "z"
joiners = ["persian_highfence_pillar"]
