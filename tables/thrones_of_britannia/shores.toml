# Thrones of Britannia: what the rivers' and lakes' shores are made of. UNCHECKED: Attila's keys (this game's packs were not looked at for its own); a
# key the game lacks draws nothing. Correct them in a shores_<anything>.toml beside it (below).
#
# This file comes with the editor (its tables folder) and an update replaces it: do not edit it. Put changes in a file beside it named
# shores_<anything>.toml that starts with a mod_key: the start of a mod pack's name, the file then read only while such a pack is loaded
# in the editor (mod_key = "tdd_pack1_main_" for The Dawnless Days), or empty (mod_key = "") to read it always, for your own changes.
# The editor never writes those, and an update leaves them alone (but those it ships). They are read after this one, in their names'
# order; a list in one replaces the list of the same name before it (whole); a list it does not have stays. The editor reads them each
# time a tile is opened.
#
# Every list needs one key at least, but bank_rocks and bank_mounds (none: no such piece is laid). A place picks one of its list's keys.
#   reeds         vegetation (species.variant): the reed beds, in the shallows and on the wet bank. Each bed is mostly one of them.
#   lilies        vegetation: floating on the water a little out from the reeds (freeform, at the water's height).
#   stones        buildings: the small stones along the waterline (half a metre to a metre).
#   ford_stones   buildings: the smallest stones, lining a ford's ends so that it shows where it is.
#   bank_stones   buildings: a small boulder on the bank now and then.
#   bank_rocks    buildings: a long flat rock laid along a river's bank, rarely (its long side, x, along the bank).
#   bank_mounds   buildings: a low ground mound laid along a river's bank, rarely (its long side, x, along the bank).
#   shore_decals  decals (as the kit's tiles write their keys): rocks from the waterline up the bank. Their normal maps must hold the
#                 normal in alpha and green (the decal shader reads it there; mud_stone01 and stones1 do not and draw lit from one side).
#   bed_decals    decals: mud and dirt from the waterline into the shallow water, and in clumps over a ford's floor.
#   splash        an effect (vfx): the looping splash over a ford's ends.
#   cliffs        buildings: a river's cliff bank's pieces (none here: the ground behind is raised alone).
#   cliff_ends    buildings: the rocks at a cliff bank's ends (none here).

