# The editor (PLAN.md, "Rust port"). CMake is left only for the Linux D3D11 libraries (cmake/linux_deps.cmake).
[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.0.1"
edition = "2024"
license = "GPL-3.0-only"

# Clippy runs in CI with its warnings as errors (`cargo clippy --workspace -- -D warnings`). Allowed here, for the whole workspace:
# - neg_cmp_op_on_partial_ord: `!(x > 0.0)` is written on purpose where a NaN must count as "not more" (a density, a step);
# - type_complexity, too_many_arguments: the renderer's and the generators' signatures are what they are;
# - needless_range_loop: index loops over parallel arrays (rows and columns of a grid) read better than zips.
[workspace.lints.clippy]
neg_cmp_op_on_partial_ord = "allow"
type_complexity = "allow"
too_many_arguments = "allow"
needless_range_loop = "allow"
# - chunks_exact_to_as_chunks: `chunks_exact(3)` over a mesh's indices reads as what it is; as_chunks changes every use's types.
chunks_exact_to_as_chunks = "allow"

[workspace.dependencies]
windows-core = "0.100"
windows-link = "0.100"
windows-bindgen = "0.100"

# rpfm_lib from rpfm's develop branch (ahead of its releases). The path line is for working against a local checkout next to this repo
# (`../rpfm`) while an rpfm change is not on develop yet.
rpfm_lib = { git = "https://github.com/Frodo45127/rpfm.git", branch = "develop", default-features = false }
# rpfm_lib = { path = "../rpfm/rpfm_lib", default-features = false }

# Windows links SDL3 statically, and the cmake crate builds opt-level 0 as a Debug config against the debug CRT (MSVCRTD), which
# clashes with the release CRT Rust links. Any opt-level above 0 makes it RelWithDebInfo, on the release CRT.
[profile.dev.package.sdl3-sys]
opt-level = 1
