# The editor (PLAN.md, "Rust port"). CMake is left only for the Linux D3D11 libraries (cmake/linux_deps.cmake).
[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT"

[workspace.dependencies]
windows-core = "0.100"
windows-link = "0.100"
windows-bindgen = "0.100"

# rpfm_lib from rpfm's develop branch (the Attila and Rome 2 formats the editor needs, ahead of the releases). For local rpfm work, a
# checkout next to this repo: rpfm_lib = { path = "../rpfm/rpfm_lib", default-features = false }
rpfm_lib = { git = "https://github.com/Frodo45127/rpfm.git", branch = "develop", default-features = false }
