# The editor (PLAN.md, "Rust port"). CMake is left only for the Linux D3D11 libraries (cmake/linux_deps.cmake).
[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.0.1"
edition = "2024"
license = "MIT"

[workspace.dependencies]
windows-core = "0.100"
windows-link = "0.100"
windows-bindgen = "0.100"

# rpfm_lib from a checkout next to this repo (the formats the editor needs, ahead of rpfm's releases: the RMV2 displacement texture
# type is on its feature/rmv2_displacement_texture branch). Without one, rpfm's develop branch:
# rpfm_lib = { git = "https://github.com/Frodo45127/rpfm.git", branch = "develop", default-features = false }
rpfm_lib = { path = "../rpfm/rpfm_lib", default-features = false }

# Windows links SDL3 statically, and the cmake crate builds opt-level 0 as a Debug config against the debug CRT (MSVCRTD), which
# clashes with the release CRT Rust links. Any opt-level above 0 makes it RelWithDebInfo, on the release CRT.
[profile.dev.package.sdl3-sys]
opt-level = 1
