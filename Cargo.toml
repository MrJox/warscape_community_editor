# Rust port of the editor (PLAN.md, "Rust port"). The C++ tree keeps building with CMake until the port reaches parity.
[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT"

[workspace.dependencies]
windows-core = "0.100"
windows-link = "0.100"
windows-bindgen = "0.100"

# rpfm_lib from rpfm's develop branch (which has the Attila formats the editor needs), checked out next to this repo.
rpfm_lib = { path = "../rpfm/rpfm_lib", default-features = false }
