[package]
name = "wce_terrain_io"
description = "Reads maps into the Terrain tool's model (wce_terrain) and writes them out of it, one module per game format: Attila's battle and campaign map folders (the cell layer PNGs, the LF TIFFs, explicit_tiles.txt, the .terry project, the XML settings), byte for byte."
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
rpfm_lib.workspace = true
rayon = "1"
thiserror = "2"
wce_foundation = { path = "../wce_foundation" }
wce_formats = { path = "../wce_formats" }
wce_terrain = { path = "../wce_terrain" }
wce_tile = { path = "../wce_tile" }
wce_tile_io = { path = "../wce_tile_io" }
wce_tile_model = { path = "../wce_tile_model" }

[dev-dependencies]
wce_vfs = { path = "../wce_vfs" }
