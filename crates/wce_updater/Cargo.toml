[package]
name = "wce_updater"
description = "The self-updater: finds a newer release of the editor on GitHub, downloads its zip with progress and installs it over the running build; downloads rpfm's schemas; and keeps the art resources' git repository up to date."
version.workspace = true
edition.workspace = true
license-file.workspace = true

[dependencies]
semver = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
ureq = { version = "3", default-features = false, features = ["rustls"] }
zip = { version = "9", default-features = false, features = ["deflate-flate2-zlib-rs"] }
wce_foundation = { path = "../wce_foundation" }

[dev-dependencies]
tempfile = "3"

[lints]
workspace = true
