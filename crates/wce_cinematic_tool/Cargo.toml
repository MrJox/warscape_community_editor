[package]
name = "wce_cinematic_tool"
description = "The Cinematic tool (docs/plans/cinematic.md): the movie viewer, then the keyed scene editor and its exports."
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
wce_audio = { path = "../wce_audio" }
# The SDL audio player (the Audio tool's).
wce_audio_tool = { path = "../wce_audio_tool" }
wce_cinematic = { path = "../wce_cinematic" }
wce_editor = { path = "../wce_editor" }
wce_editor_core = { path = "../wce_editor_core" }
wce_foundation = { path = "../wce_foundation" }
wce_formats = { path = "../wce_formats" }
wce_render = { path = "../wce_render" }
# The pack writer (wce_walls::pack).
wce_walls = { path = "../wce_walls" }
wce_scene = { path = "../wce_scene" }
rpfm_lib.workspace = true
wce_vfs = { path = "../wce_vfs" }
wce_video = { path = "../wce_video" }

# The battle logic graph's canvas: imnodes (MIT) through its C API, built against the editor's dear-imgui-sys (user 2026-11-20).
dear-imnodes-sys = "0.20"
dear-imgui-sys = "0.20"

[lints]
workspace = true
