[package]
name = "wce_cinematic"
description = "The Cinematic tool's headless layer (docs/plans/cinematic.md): the game's movies with their audio events and subtitles, the keyed scene model, its evaluation and the compilers to movies and historical battles."
version.workspace = true
edition.workspace = true
license-file.workspace = true

[dependencies]
rpfm_lib.workspace = true
# The project file: pretty JSON (diffable text, docs/plans/cinematic.md "Save").
serde = { version = "1", features = ["derive"] }
serde_json = "1"
wce_audio = { path = "../wce_audio" }
wce_audio_format = { path = "../wce_audio_format" }
wce_foundation = { path = "../wce_foundation" }
wce_formats = { path = "../wce_formats" }
wce_vfs = { path = "../wce_vfs" }
wce_video = { path = "../wce_video" }
# The mod pack writer (wce_walls::pack).
wce_walls = { path = "../wce_walls" }

[lints]
workspace = true
