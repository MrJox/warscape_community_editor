[package]
name = "wce_ui_cli"
description = "wce-ui: command line and MCP server for Total War UI layouts. Opens layouts from the game's packs, converts them to XML and back, edits and renders them, and saves them into a mod pack."
version.workspace = true
edition.workspace = true
license.workspace = true

[[bin]]
name = "wce-ui"
path = "src/main.rs"

[dependencies]
rpfm_lib.workspace = true
serde_json = "1"
wce_foundation = { path = "../wce_foundation" }
wce_ui_format = { path = "../wce_ui_format" }
wce_ui_model = { path = "../wce_ui_model" }
wce_vfs = { path = "../wce_vfs" }
