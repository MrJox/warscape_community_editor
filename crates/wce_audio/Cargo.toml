[package]
name = "wce_audio"
description = "The headless audio layer: decoding the game's sound files, the names of sounds, what an event plays. Shared by the Audio tool and, later, the Cinematic tool."
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
# Pure Rust Vorbis decoding of the packets rebuilt from Wwise Vorbis (no Ogg container, so no default features).
lewton = { version = "0.10", default-features = false }
# Encoding: libvorbis with aoTuV's encoder (and the Lancer speed patches), built from the crate's bundled C source (BSD-3; user 2026-11-19).
aotuv_lancer_vorbis_sys = "0.1.6"
ogg_next_sys = "0.1.5"
thiserror = "2"
wce_audio_format = { path = "../wce_audio_format" }
wce_vfs = { path = "../wce_vfs" }
# The sound DB tables (rpfm's DB decoder and schema, as the terrain crates read theirs).
rpfm_lib.workspace = true
wce_foundation = { path = "../wce_foundation" }
# .snd.meta (the animation metadata layout).
wce_formats = { path = "../wce_formats" }

[lints]
workspace = true
