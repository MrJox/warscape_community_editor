[package]
name = "wce_app"
description = "Warscape Community Editor (wce): the window, the D3D11 device, Dear ImGui with docking, the tool registry and the frame loop."
version.workspace = true
edition.workspace = true
license.workspace = true

[[bin]]
name = "wce"
path = "src/main.rs"

# One feature per editor, so that a release builds only the editors that work. The default set is the release's; scripts and gates build with
# --all-features.
[features]
default = ["weather", "tile", "ui"]
weather = ["dep:wce_weather_tool"]
tile = ["dep:wce_tile_tool"]
ui = ["dep:wce_ui_tool"]

# The tabs of the editors still to come (unit, VFX, terrain, cinematic): only their plans, no features.
placeholders = []

[dependencies]
dear-imgui-rs = "0.20"
dear-imgui-sys = "0.20"
wce_d3d11 = { path = "../wce_d3d11" }
wce_editor = { path = "../wce_editor" }
wce_foundation = { path = "../wce_foundation" }
wce_imgui = { path = "../wce_imgui" }
wce_render = { path = "../wce_render" }
wce_tile_tool = { path = "../wce_tile_tool", optional = true }
wce_ui_tool = { path = "../wce_ui_tool", optional = true }
wce_weather_tool = { path = "../wce_weather_tool", optional = true }

[target.'cfg(windows)'.dependencies]
# Build the same SDL3 version as sdl3-sys so Windows builds do not need a separate SDL SDK install.
sdl3-sys = { version = "0.7", default-features = false, features = ["build-from-source"] }

[target.'cfg(not(windows))'.dependencies]
sdl3-sys = "0.7"
