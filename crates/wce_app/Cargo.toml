[package]
name = "wce_app"
description = "Warscape Community Editor (wce): the window, the D3D11 device, Dear ImGui with docking, the tool registry and the frame loop."
version.workspace = true
edition.workspace = true
license-file.workspace = true

[[bin]]
name = "wce"
path = "src/main.rs"

# One feature per editor. Development builds every editor (the default); releases and nightlies build only the stable ones, with
# `--no-default-features --features release` (.github/workflows/release.yml and nightly.yml, the Flatpak manifest).
[features]
default = ["weather", "prefab", "tile", "terrain", "ui", "audio", "cinematic", "unit", "vfx"]
# The editors stable enough to ship.
release = ["weather", "prefab", "tile", "ui", "audio"]
weather = ["dep:wce_weather_tool"]
tile = ["dep:wce_tile_tool"]
# The Prefab tool (docs/plans/prefab_tool.md): a Tile tool on a stage of its own.
prefab = ["tile"]
ui = ["dep:wce_ui_tool"]
# The Audio tool (docs/plans/audio.md): sound banks, names, search, playback.
audio = ["dep:wce_audio_tool"]
# The Cinematic tool (docs/plans/cinematic.md): the movie viewer, then keyed scenes, movies and historical battles. Not in releases yet.
cinematic = ["dep:wce_cinematic_tool"]
# The Terrain tool (docs/plans/terrain_editor.md): battle maps shown whole, streamed around the camera. Not in releases yet.
terrain = ["dep:wce_terrain_tool"]
# The Unit tool (docs/plans/unit_editor.md): variant mesh definitions worn by a unit. Not in releases yet.
unit = ["dep:wce_unit_tool"]
# The VFX tool (docs/plans/vfx_tool.md): vfx/*.xml edited visually. Not in releases yet.
vfx = ["dep:wce_vfx_tool"]

# The tabs of the editors still to come: only their plans, no features (none at present).
placeholders = []

[dependencies]
dear-imgui-rs = "0.20"
wce_d3d11 = { path = "../wce_d3d11" }
wce_editor = { path = "../wce_editor" }
wce_foundation = { path = "../wce_foundation" }
wce_imgui = { path = "../wce_imgui" }
wce_render = { path = "../wce_render" }
wce_terrain_tool = { path = "../wce_terrain_tool", optional = true }
wce_tile_tool = { path = "../wce_tile_tool", optional = true }
wce_ui_tool = { path = "../wce_ui_tool", optional = true }
wce_audio_tool = { path = "../wce_audio_tool", optional = true }
wce_cinematic_tool = { path = "../wce_cinematic_tool", optional = true }
wce_unit_tool = { path = "../wce_unit_tool", optional = true }
wce_vfx_tool = { path = "../wce_vfx_tool", optional = true }
wce_weather_tool = { path = "../wce_weather_tool", optional = true }

[target.'cfg(windows)'.dependencies]
# Build the same SDL3 version as sdl3-sys so Windows builds do not need a separate SDL SDK install. Linked statically:
# with the build-dir in .cargo/config.toml, sdl3-sys would copy SDL3.dll there instead of next to the exe.
sdl3-sys = { version = "0.7", default-features = false, features = ["build-from-source", "link-static"] }

[target.'cfg(not(windows))'.dependencies]
sdl3-sys = "0.7"

[lints]
workspace = true
