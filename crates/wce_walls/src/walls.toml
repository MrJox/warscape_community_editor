# The base walls procedural walls (WceWallSpline) are generated from, in the order the editor lists them.
#
# The editor writes this file where it is missing and reads it each time a tile is opened; the Inspector's Wall base row lists the bases
# whose pieces the game's files have. Add a culture's wall here; no rebuild of the editor needed. Delete the file to get these back.
# Docs: docs/re/buildings.md ("The families", "The kit table"), docs/plans/procedural_walls.md.
#
# In a piece's frame, scene units (the models' units): x along the wall, -z the outer side, y = 0 the ground the piece stands on.
#
# [families.<name>]: what the bases of a family share (every number below; a base can set any of them again).
#   x             where the frame starts and ends along x (the 8 m pieces run 0..20 from their origin, the 15 m ones -10..10)
#   walkway       the walkway's height over the piece's ground
#   outer_face    the outer face's line (z), where ladders and towers meet the wall
#   depth         the footprint across the wall (z), the outer side first
#   step_rise, step_run   the most one stair rises, and its length along the wall
#   step_gap      between two chained step sections, flat
#   max_slope     the steepest the wall itself may slope over a step (rise per unit along it)
#   min_run       the shortest flat run between two steps
#   whole_rise    a climb of about this much over a short straight stretch is one whole step piece (0: never)
#   cap_join      the caps' joining x, at the start and at the end
#   foot, bury    below foot[1] the mesh stretches so its bottom (foot[0]) reaches bury under the terrain
#   slab_up, slab_down, slab_walk   the step section of a step piece: its x going up and down, the walkway's height where it starts
#   slab_zy       optional: what of the step section is brought (z range, then y range); none: its whole cross-section
#   step_replaces whether the step section replaces the base over its length, or is added to it
#   slab_band     optional: only what lies within this (y) of the stair's slope is brought
#   step_across   the stair spread across the whole walkway
#   door_at       where the door section's doors come out on the ground (x, z)
#
# [[bases]]: a base wall.
#   key           its straight piece (a building key); label: its name in the editor's list; family: one of the families above
#   cap_start, cap_end   the pieces that close a free end, at the start and at the end
#   step_up, step_down   the culture's step pieces, going up and going down along +x
#   door          the culture's door section (empty: none)
#   defences      the culture's in-line towers and bastions, used in turn at the wall's defence spacing

[families.eight]
x = [0.0, 20.0]
walkway = 8.0
outer_face = -2.5
depth = [-3.0, 12.0]
step_rise = 2.5
step_run = 3.0
step_gap = 2.0
max_slope = 0.8333333333333334
min_run = 10.0
whole_rise = 0.0
cap_join = [0.0, 0.0]
foot = [-2.0, 0.0]
bury = 2.0
slab_up = [2.0, 5.0]
slab_down = [2.0, 5.0]
slab_walk = [8.0, 13.0]
slab_zy = [[-3.5, 3.0], [-3.0, 16.0]]
step_replaces = true
step_across = false
door_at = [0.0, 0.0]

[families.fifteen]
x = [-10.0, 10.0]
walkway = 15.0
outer_face = 0.0
depth = [-6.0, 16.0]
step_rise = 10.0
step_run = 12.0
step_gap = 4.0
max_slope = 0.4
min_run = 20.0
whole_rise = 10.0
cap_join = [10.0, -10.0]
foot = [0.0, 2.0]
bury = 0.5
slab_up = [-5.8, 6.2]
slab_down = [-6.2, 5.8]
slab_walk = [15.0, 25.0]
slab_zy = [[5.1, 8.9], [14.0, 26.5]]
step_replaces = false
slab_band = 0.9
step_across = true
door_at = [0.0, 13.0]

