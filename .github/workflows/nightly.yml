# Builds a nightly release every day at 02:00 UTC (if there are new commits on master) or on demand via workflow_dispatch: the Windows zip
# and the Linux Flatpak, as the release workflow does.
#
# Releases are tagged as `v<version>-nightly.YYYYMMDD` and marked as GitHub pre-releases,
# matching the semver naming convention expected by `crates/wce_updater` when pre-releases are enabled.

name: Nightly Release

on:
  schedule:
    # 02:00 UTC every day
    - cron: '0 2 * * *'
  workflow_dispatch:

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    name: Check for new commits
    runs-on: ubuntu-latest
    outputs:
      should_build: ${{ steps.check.outputs.should_build }}
      version: ${{ steps.version.outputs.version }}
      base_version: ${{ steps.version.outputs.base_version }}
      tag_name: ${{ steps.version.outputs.tag_name }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - id: check
        name: Check if master has new commits
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "Manual trigger: proceeding with nightly build."
            echo "should_build=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # Find the newest tag matching v*-nightly.*
          latest_nightly_tag=$(git tag -l "v*-nightly.*" --sort=-creatordate | head -n 1)
          if [ -z "$latest_nightly_tag" ]; then
            echo "No previous nightly tag found: proceeding with build."
            echo "should_build=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          echo "Latest nightly tag: $latest_nightly_tag"
          count=$(git rev-list "${latest_nightly_tag}..HEAD" --count)
          echo "Commits on HEAD since $latest_nightly_tag: $count"

          if [ "$count" -gt 0 ]; then
            echo "New commits detected ($count). Proceeding with build."
            echo "should_build=true" >> "$GITHUB_OUTPUT"
          else
            echo "No new commits since $latest_nightly_tag: skipping nightly build."
            echo "should_build=false" >> "$GITHUB_OUTPUT"
          fi

      - id: version
        name: Compute the nightly version
        if: steps.check.outputs.should_build == 'true'
        shell: bash
        run: |
          date=$(date -u +'%Y%m%d')
          base_version=$(cargo metadata --no-deps --format-version 1 | jq -r '.packages[] | select(.name == "wce_app") | .version')

          # Parse major.minor.patch
          IFS='.' read -r major minor patch <<< "$base_version"

          # If the current workspace base version is already an official release tag (e.g. v0.0.1),
          # the upcoming nightly pre-release targets the next patch version.
          if git rev-parse "v${base_version}" >/dev/null 2>&1; then
            next_patch=$((patch + 1))
            nightly_version="${major}.${minor}.${next_patch}-nightly.${date}"
          else
            nightly_version="${base_version}-nightly.${date}"
          fi

          echo "Base version: ${base_version}"
          echo "Nightly version: ${nightly_version}"
          echo "version=${nightly_version}" >> "$GITHUB_OUTPUT"
          echo "base_version=${base_version}" >> "$GITHUB_OUTPUT"
          echo "tag_name=v${nightly_version}" >> "$GITHUB_OUTPUT"

      # The Flatpak builds offline: every crate of Cargo.lock as a source (packaging/flatpak/README.md).
      - name: Make the Flatpak's cargo sources
        if: steps.check.outputs.should_build == 'true'
        run: .github/flatpak-cargo-sources.sh

      - uses: actions/upload-artifact@v7
        if: steps.check.outputs.should_build == 'true'
        with:
          name: cargo-sources
          path: packaging/flatpak/cargo-sources.json

  windows:
    name: Windows build
    needs: check
    if: needs.check.outputs.should_build == 'true'
    runs-on: windows-2022
    # windows-latest ships only Visual Studio 2026; .cargo/config.toml pins the VS 2022 generator.

    env:
      # A short target path, so that SDL's MSBuild compiler check can create its temporary files (README, Windows).
      CARGO_TARGET_DIR: C:\t
      VERSION: ${{ needs.check.outputs.version }}
      BASE_VERSION: ${{ needs.check.outputs.base_version }}

    steps:
      - uses: actions/checkout@v7

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      # [workspace.package] version, so that the built binary knows its nightly version.
      - name: Write the nightly version into Cargo.toml
        shell: bash
        run: .github/nightly-version.sh "$BASE_VERSION" "$VERSION"

      - name: Build
        # Only the editors that ship (wce_app's `release` feature).
        run: cargo build --release -p wce_app --no-default-features --features release

      # SDL3 links statically, so wce.exe needs no SDL3.dll beside it.
      - name: Package
        shell: pwsh
        run: |
          $dist = New-Item -ItemType Directory -Force dist
          Copy-Item "$env:CARGO_TARGET_DIR\release\wce.exe" $dist
          Copy-Item README.md, THIRD_PARTY.md $dist
          # The editor's tables (wall and bridge bases, road fences), read from its folder; users add *_custom.toml beside them.
          Copy-Item -Recurse tables $dist
          Compress-Archive -Path "$dist\*" -DestinationPath "wce-$env:VERSION-windows-x64.zip"

      - uses: actions/upload-artifact@v7
        with:
          name: windows
          path: wce-${{ env.VERSION }}-windows-x64.zip

  flatpak:
    name: Linux Flatpak
    needs: check
    if: needs.check.outputs.should_build == 'true'
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/flathub-infra/flatpak-github-actions:freedesktop-26.08
      options: --privileged

    env:
      VERSION: ${{ needs.check.outputs.version }}
      BASE_VERSION: ${{ needs.check.outputs.base_version }}

    steps:
      - uses: actions/checkout@v7

      - uses: actions/download-artifact@v8
        with:
          name: cargo-sources
          path: packaging/flatpak

      # The manifest builds this checkout: the version goes into Cargo.toml (the binary's) and the metainfo.
      - name: Write the nightly version
        run: |
          .github/nightly-version.sh "$BASE_VERSION" "$VERSION"
          sed -i "s|<release version=\"[^\"]*\" date=\"[^\"]*\"|<release version=\"${VERSION}\" date=\"$(date -u +%Y-%m-%d)\"|" \
            packaging/flatpak/io.github.mrjox.WarscapeCommunityEditor.metainfo.xml

      - uses: flatpak/flatpak-github-actions/flatpak-builder@v6
        with:
          bundle: wce-${{ env.VERSION }}-linux-x86_64.flatpak
          manifest-path: packaging/flatpak/io.github.mrjox.WarscapeCommunityEditor.yaml
          cache-key: flatpak-builder-${{ github.sha }}
          upload-artifact: false

      - uses: actions/upload-artifact@v7
        with:
          name: flatpak
          path: wce-${{ env.VERSION }}-linux-x86_64.flatpak

  publish:
    name: Publish the nightly release
    needs: [check, windows, flatpak]
    runs-on: ubuntu-latest

    steps:
      - uses: actions/download-artifact@v8
        with:
          path: dist
          merge-multiple: true

      - uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ needs.check.outputs.tag_name }}
          target_commitish: ${{ github.sha }}
          name: Warscape Community Editor Nightly ${{ needs.check.outputs.version }}
          files: |
            dist/wce-${{ needs.check.outputs.version }}-windows-x64.zip
            dist/wce-${{ needs.check.outputs.version }}-linux-x86_64.flatpak
          prerelease: true
          make_latest: false
          generate_release_notes: true
          fail_on_unmatched_files: true
