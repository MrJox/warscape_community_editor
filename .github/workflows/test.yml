      - name: Build libs and server
        uses: actions-rs/cargo@v1
        with:
          command: build
          args: |
            -p wce_foundation \
            -p wce_formats \
            -p wce_assets \
            -p wce_vfs \
            -p wce_tile \
            -p wce_tile_editor \
            -p wce_tile_io

      - name: Run tests
        uses: actions-rs/cargo@v1
        with:
          command: test
          args: |
            -p wce_foundation \
            -p wce_formats \
            -p wce_assets \
            -p wce_vfs \
            -p wce_tile \
            -p wce_tile_editor \
            -p wce_tile_io
