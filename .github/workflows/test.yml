name: Tests

on:
  push:
    branches: [ master, feature/ci_release_updater ]
  pull_request:
    branches: [ master ]

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

  # The whole workspace with its tests and examples (the gates) is tens of GB with debug info and incremental data: more than a runner's disk.
  CARGO_INCREMENTAL: 0
  CARGO_PROFILE_DEV_DEBUG: 0

jobs:
  linux:
    name: Linux (DXVK-native)
    runs-on: ubuntu-latest

    # The Linux build links DXVK-native and vkd3d-utils, built by the CMake step (README, Linux). They need the SDL3 development files,
    # which Ubuntu does not package; Arch has every dependency the README lists.
    container: archlinux:latest

    steps:
      - name: Install the build dependencies
        run: |
          pacman -Syu --noconfirm --needed base-devel git rustup cmake ninja meson glslang autoconf automake libtool bison flex perl wine \
            sdl3 vulkan-headers vulkan-icd-loader
          rustup default stable
          git config --global --add safe.directory '*'

      - uses: actions/checkout@v4

      # The CMake step skips what its stamps in the prefix say is built.
      - name: Cache DXVK-native and vkd3d
        uses: actions/cache@v4
        with:
          path: build/_deps/prefix
          key: linux-deps-${{ hashFiles('cmake/linux_deps.cmake', 'CMakeLists.txt') }}

      - uses: Swatinem/rust-cache@v2

      - name: Build DXVK-native and vkd3d
        run: cmake -S . -B build -G Ninja

      - name: Build
        run: cargo build --workspace --all-targets --all-features --locked

      - name: Test
        run: cargo test --workspace --all-features --locked

  windows:
    name: Windows
    runs-on: windows-latest

    env:
      # A short target path, so that SDL's MSBuild compiler check can create its temporary files (README, Windows).
      CARGO_TARGET_DIR: C:\t

    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - name: Build
        run: cargo build --workspace --all-targets --all-features --locked

      - name: Test
        run: cargo test --workspace --all-features --locked
